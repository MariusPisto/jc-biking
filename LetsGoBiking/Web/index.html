<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Itinéraire</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/toaster.css" />
    <link rel="stylesheet" href="css/loading.css" />
  </head>
  <body>
    <div id="loader" style="display: none">
      <div class="loader-content">
        <!-- from https://codepen.io/jkantner/pen/XWPbNNE -->
        <svg class="bike" viewBox="0 0 48 30" width="48px" height="30px">
          <g
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1"
          >
            <g transform="translate(9.5,19)">
              <circle
                class="bike__tire"
                r="9"
                stroke-dasharray="56.549 56.549"
              />
              <g
                class="bike__spokes-spin"
                stroke-dasharray="31.416 31.416"
                stroke-dashoffset="-23.562"
              >
                <circle class="bike__spokes" r="5" />
                <circle
                  class="bike__spokes"
                  r="5"
                  transform="rotate(180,0,0)"
                />
              </g>
            </g>
            <g transform="translate(24,19)">
              <g
                class="bike__pedals-spin"
                stroke-dasharray="25.133 25.133"
                stroke-dashoffset="-21.991"
                transform="rotate(67.5,0,0)"
              >
                <circle class="bike__pedals" r="4" />
                <circle
                  class="bike__pedals"
                  r="4"
                  transform="rotate(180,0,0)"
                />
              </g>
            </g>
            <g transform="translate(38.5,19)">
              <circle
                class="bike__tire"
                r="9"
                stroke-dasharray="56.549 56.549"
              />
              <g
                class="bike__spokes-spin"
                stroke-dasharray="31.416 31.416"
                stroke-dashoffset="-23.562"
              >
                <circle class="bike__spokes" r="5" />
                <circle
                  class="bike__spokes"
                  r="5"
                  transform="rotate(180,0,0)"
                />
              </g>
            </g>
            <polyline
              class="bike__seat"
              points="14 3,18 3"
              stroke-dasharray="5 5"
            />
            <polyline
              class="bike__body"
              points="16 3,24 19,9.5 19,18 8,34 7,24 19"
              stroke-dasharray="79 79"
            />
            <path
              class="bike__handlebars"
              d="m30,2h6s1,0,1,1-1,1-1,1"
              stroke-dasharray="10 10"
            />
            <polyline
              class="bike__front"
              points="32.5 2,38.5 19"
              stroke-dasharray="19 19"
            />
          </g>
        </svg>
        <p>Calcul de l'itinéraire</p>
      </div>
    </div>
    <div id="toaster-container"></div>
    <div id="map"></div>
    <div class="itinerary-panel" id="itinerary-panel">
      <h2>Itinéraire</h2>
      <div class="input-group">
        <label for="start-autocomplete">Départ</label>
        <address-autocomplete
          id="start-autocomplete"
          placeholder="Adresse de départ"
        >
        </address-autocomplete>
      </div>
      <div class="input-group">
        <label for="end-autocomplete">Arrivée</label>
        <address-autocomplete
          id="end-autocomplete"
          placeholder="Adresse d'arrivée"
        >
        </address-autocomplete>
      </div>
      <div class="notification-section closed">
        <h4>
          Notifications en temps réel
          <button class="toggle-arrow"></button>
        </h4>
        <div class="notification-content">
          <div class="notification-items-container">
            <label>
              <input type="checkbox" id="sub-weather-btn" />
              Alertes Météo
            </label>
            <label>
              <input type="checkbox" id="sub-pollution-btn" />
              Alertes Pollution
            </label>
          </div>
        </div>
      </div>
      <button id="calculate-route-btn">Calculer l'itinéraire</button>
      <button id="demo-btn" type="button">Demo</button>
      <button id="reset-route-btn">Réinitialiser</button>
      <div id="results-container">
        <div id="itinerary-status"></div>
        <ol id="steps"></ol>
      </div>
    </div>
    <button
      id="panel-toggle-btn"
      class="panel-toggle-btn"
      aria-label="Masquer le panneau"
    >
      <span class="icon-arrow"></span>
    </button>
    <button id="view-switch-btn" class="view-switch-btn">Voir la carte</button>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="config.js"></script>
    <script type="module" src="js/app.js"></script>
    <script src="js/stomp.js"></script>
    <script src="js/notification.js"></script>
  </body>
</html>
