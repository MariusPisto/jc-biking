<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Itinéraire</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/toaster.css" />
    <link rel="stylesheet" href="css/loading.css" />
    <link rel="stylesheet" href="css/panel.css" />
  </head>
  <body>
    <div id="loader" class="hidden">
      <div class="loader-content">
        <svg class="bike" viewBox="0 0 48 30" width="48px" height="30px">
          <g
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1"
          >
            <g transform="translate(9.5,19)">
              <circle
                class="bike__tire"
                r="9"
                stroke-dasharray="56.549 56.549"
              />
              <g
                class="bike__spokes-spin"
                stroke-dasharray="31.416 31.416"
                stroke-dashoffset="-23.562"
              >
                <circle class="bike__spokes" r="5" />
                <circle
                  class="bike__spokes"
                  r="5"
                  transform="rotate(180,0,0)"
                />
              </g>
            </g>
            <g transform="translate(24,19)">
              <g
                class="bike__pedals-spin"
                stroke-dasharray="25.133 25.133"
                stroke-dashoffset="-21.991"
                transform="rotate(67.5,0,0)"
              >
                <circle class="bike__pedals" r="4" />
                <circle
                  class="bike__pedals"
                  r="4"
                  transform="rotate(180,0,0)"
                />
              </g>
            </g>
            <g transform="translate(38.5,19)">
              <circle
                class="bike__tire"
                r="9"
                stroke-dasharray="56.549 56.549"
              />
              <g
                class="bike__spokes-spin"
                stroke-dasharray="31.416 31.416"
                stroke-dashoffset="-23.562"
              >
                <circle class="bike__spokes" r="5" />
                <circle
                  class="bike__spokes"
                  r="5"
                  transform="rotate(180,0,0)"
                />
              </g>
            </g>
            <polyline
              class="bike__seat"
              points="14 3,18 3"
              stroke-dasharray="5 5"
            />
            <polyline
              class="bike__body"
              points="16 3,24 19,9.5 19,18 8,34 7,24 19"
              stroke-dasharray="79 79"
            />
            <path
              class="bike__handlebars"
              d="m30,2h6s1,0,1,1-1,1-1,1"
              stroke-dasharray="10 10"
            />
            <polyline
              class="bike__front"
              points="32.5 2,38.5 19"
              stroke-dasharray="19 19"
            />
          </g>
        </svg>
        <p>Calcul de l'itinéraire</p>
        <div id="loading-phrases"></div>
      </div>
    </div>
    <div id="toaster-container"></div>
    <div id="map"></div>
    <div class="itinerary-panel" id="itinerary-panel">
      <div class="panel-header">
        <h2>Itinéraire</h2>
      </div>
      <div class="panel-content">
        <div class="route-card">
          <div class="search-row top">
            <span class="search-label">Départ :</span>
            <address-autocomplete
              id="start-autocomplete"
              placeholder="Adresse de départ"
            >
            </address-autocomplete>
          </div>

          <div class="divider-line"></div>

          <div class="search-row bottom">
            <span class="search-label">Arrivée :</span>
            <address-autocomplete
              id="end-autocomplete"
              placeholder="Où allons-nous ?"
            >
            </address-autocomplete>
          </div>

          <button
            id="swap-addresses-btn"
            class="floating-swap-btn"
            aria-label="Inverser les adresses"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M7 4v16M7 4l-4 4M7 20l4-4M17 20V4M17 20l4-4M17 4l-4 4" />
            </svg>
          </button>
        </div>

        <div class="notification-section closed">
          <h4>
            Notifications en temps réel
            <button class="toggle-arrow"></button>
          </h4>
          <div class="notification-content">
            <div class="notification-items-container">
              <label>
                <span>Alertes Météo</span>
                <input type="checkbox" id="sub-weather-btn" />
              </label>
              <label>
                <span>Alertes Pollution</span>
                <input type="checkbox" id="sub-pollution-btn" />
              </label>
            </div>
          </div>
        </div>
        <div class="button-group">
          <button id="calculate-route-btn" class="primary">
            Calculer l'itinéraire
          </button>
          <div class="button-row">
            <button id="demo-btn" type="button" class="secondary">Demo</button>
            <button id="reset-route-btn" class="tertiary">Réinitialiser</button>
          </div>
        </div>
        <div id="results-container">
          <div id="itinerary-status"></div>
          <ol id="steps"></ol>
        </div>
      </div>
    </div>
    <button
      id="panel-toggle-btn"
      class="panel-toggle-btn"
      aria-label="Masquer le panneau"
    >
      <span class="icon-arrow"></span>
    </button>
    <button id="view-switch-btn" class="view-switch-btn">Voir la carte</button>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="config.js"></script>
    <script type="module" src="js/app.js"></script>
    <script src="js/stomp.js"></script>
    <script src="js/notification.js"></script>
    <script src="js/loading-phrases.js"></script>
  </body>
</html>
